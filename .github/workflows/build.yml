name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build and release (e.g. v2.7.23)'
        required: true
        default: 'v2.7.23'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            echo "TAG=$TAG" >> $GITHUB_OUTPUT
            echo "Building for manually specified tag: $TAG"
            git checkout "$TAG"
          else
            TAG="${{ github.ref_name }}"
            echo "TAG=$TAG" >> $GITHUB_OUTPUT
            echo "Building for pushed tag: $TAG"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bun
        run: |
          npm install -g bun
          bun --version

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma Client
        run: bun run db:generate

      - name: Build Next.js
        run: bun run build
        env:
          DATABASE_URL: "file:./pos.db"

      - name: Prepare Electron
        run: node scripts/prepare-electron.mjs
        env:
          DATABASE_URL: "file:./pos.db"

      - name: Build Windows Installer
        run: bunx electron-builder --win nsis --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find EXE file
        id: find-exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "release" -Filter "Shop-POS-System-Setup-*.exe" | Select-Object -First 1
          if ($exe) {
            echo "EXE_PATH=$($exe.FullName)" >> $env:GITHUB_OUTPUT
            echo "EXE_NAME=$($exe.Name)" >> $env:GITHUB_OUTPUT
            echo "Found: $($exe.FullName) ($([math]::Round($exe.Length/1MB, 1)) MB)"
          } else {
            echo "ERROR: No Setup EXE found in release folder"
            Get-ChildItem -Path "release" -Recurse | ForEach-Object { echo $_.FullName }
            exit 1
          }

      - name: Delete existing release assets (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.TAG }}"
          echo "Cleaning up existing release assets for $TAG..."
          # Get release ID
          RELEASE_DATA=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")
          RELEASE_ID=$(echo "$RELEASE_DATA" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || echo "")
          if [ -n "$RELEASE_ID" ]; then
            echo "Found release ID: $RELEASE_ID, cleaning old assets..."
            ASSETS=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets" | \
              python3 -c "import json,sys; [print(a['id']) for a in json.load(sys.stdin)]" 2>/dev/null || echo "")
            for ASSET_ID in $ASSETS; do
              echo "Deleting asset $ASSET_ID..."
              curl -s -X DELETE -H "Authorization: token $GH_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/releases/assets/$ASSET_ID"
            done
          else
            echo "No existing release found for $TAG, will create new one"
          fi

      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          files: ${{ steps.find-exe.outputs.EXE_PATH }}
          name: Shop POS System ${{ steps.tag.outputs.TAG }}
          body: |
            ## Shop POS System ${{ steps.tag.outputs.TAG }}

            **Windows Installer (.exe)**

            ### Installation:
            1. Download `Shop-POS-System-Setup-${{ steps.tag.outputs.TAG }}.exe`
            2. Double-click to run the installer
            3. Follow the installation wizard

            Built automatically via GitHub Actions.
          draft: false
          prerelease: false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
