name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bun
        run: |
          npm install -g bun
          bun --version

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma Client
        run: bun run db:generate

      - name: Build Next.js
        run: bun run build
        env:
          DATABASE_URL: "file:./pos.db"

      - name: Prepare Electron
        run: node scripts/prepare-electron.mjs
        env:
          DATABASE_URL: "file:./pos.db"

      - name: Build Windows Installer
        run: bunx electron-builder --win nsis --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find EXE file
        id: find-exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "release" -Filter "Shop-POS-System-Setup-*.exe" | Select-Object -First 1
          if ($exe) {
            echo "EXE_PATH=$($exe.FullName)" >> $env:GITHUB_OUTPUT
            echo "EXE_NAME=$($exe.Name)" >> $env:GITHUB_OUTPUT
            echo "Found: $($exe.FullName) ($([math]::Round($exe.Length/1MB, 1)) MB)"
          } else {
            echo "ERROR: No Setup EXE found in release folder"
            Get-ChildItem -Path "release" -Recurse | ForEach-Object { echo $_.FullName }
            exit 1
          }

      - name: Upload EXE to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $exePath = "${{ steps.find-exe.outputs.EXE_PATH }}"
          $exeName = "${{ steps.find-exe.outputs.EXE_NAME }}"
          $tag = "${{ github.ref_name }}"
          Write-Host "Uploading $exeName to release $tag"
          $uploadUrl = "https://uploads.github.com/repos/${{ github.repository }}/releases/tags/$tag/assets?name=$exeName"
          $headers = @{
            "Authorization" = "token $env:GH_TOKEN"
            "Content-Type" = "application/octet-stream"
          }
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-RestMethod -Uri $uploadUrl -Method Post -Headers $headers -InFile $exePath
          Write-Host "Upload complete!"
