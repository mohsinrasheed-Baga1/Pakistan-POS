name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build and release (e.g. v2.7.30)'
        required: true
        default: 'v2.7.30'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            echo "TAG=$TAG" >> $GITHUB_OUTPUT
            echo "Building for manually specified tag: $TAG"
            git checkout "$TAG"
          else
            TAG="${{ github.ref_name }}"
            echo "TAG=$TAG" >> $GITHUB_OUTPUT
            echo "Building for pushed tag: $TAG"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bun
        run: |
          npm install -g bun
          bun --version

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma Client
        run: bun run db:generate

      - name: Build Next.js
        run: bun run build
        env:
          DATABASE_URL: "file:./pos.db"

      - name: Prepare Electron
        run: node scripts/prepare-electron.mjs
        env:
          DATABASE_URL: "file:./pos.db"

      - name: Delete existing release for this tag ONLY (prevent duplicates)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.TAG }}
        run: |
          echo "=== Checking for existing release for $TAG ==="
          # List all releases and find any with this tag
          EXISTING_IDS=$(gh api repos/${{ github.repository }}/releases --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .id" 2>/dev/null || echo "")
          if [ -n "$EXISTING_IDS" ]; then
            for id in $EXISTING_IDS; do
              echo "Deleting existing release id=$id for tag $TAG"
              gh api -X DELETE "repos/${{ github.repository }}/releases/$id" 2>/dev/null || echo "Failed to delete $id (may not exist)"
            done
          else
            echo "No existing release found for $TAG"
          fi

      - name: Build Windows Installer and Publish to GitHub (delta updates)
        run: bunx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify installer was built
        shell: bash
        run: |
          echo "=== Files in release/ ==="
          ls -la release/ || true
          echo ""
          echo "=== Looking for .exe ==="
          find release/ -name "*.exe" -type f 2>/dev/null || true
          echo ""
          # Verify the .exe exists and has reasonable size (>10MB)
          EXE_FILE=$(find release/ -name "Shop-POS-System-Setup-*.exe" -type f | head -1)
          if [ -z "$EXE_FILE" ]; then
            echo "ERROR: No .exe file found in release/"
            echo ""
            echo "=== Full release/ contents (recursive) ==="
            find release/ -type f 2>/dev/null | head -20
            exit 1
          fi
          EXE_SIZE=$(stat -c%s "$EXE_FILE" 2>/dev/null || wc -c < "$EXE_FILE")
          EXE_SIZE_MB=$((EXE_SIZE / 1024 / 1024))
          echo "Found: $EXE_FILE ($EXE_SIZE bytes = ${EXE_SIZE_MB} MB)"
          if [ "$EXE_SIZE" -lt 10000000 ]; then
            echo "ERROR: .exe file is too small ($EXE_SIZE bytes < 10MB) — build likely incomplete"
            exit 1
          fi
          echo "✓ Installer verified (${EXE_SIZE_MB} MB)"

      - name: Verify EXE was uploaded to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.TAG }}
        run: |
          echo "=== Checking if EXE was uploaded to release $TAG ==="
          sleep 10
          # Get the release ID
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.id' 2>/dev/null)
          if [ -z "$RELEASE_ID" ]; then
            echo "WARNING: Could not find release for tag $TAG"
            exit 0
          fi
          echo "Release ID: $RELEASE_ID"
          # List all assets
          echo "=== Assets in release $TAG ==="
          gh api "repos/${{ github.repository }}/releases/$RELEASE_ID/assets" --jq '.[] | "\(.name) (\(.size) bytes)"'
          # Check if EXE is there
          EXE_ASSET=$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID/assets" --jq '.[] | select(.name | endswith(".exe")) | .name' 2>/dev/null)
          if [ -z "$EXE_ASSET" ]; then
            echo ""
            echo "⚠️  WARNING: EXE is NOT uploaded to release (only blockmap is)."
            echo "This usually means the EXE upload timed out or hit a size limit."
            echo "Attempting manual upload..."
            # Find the local EXE
            EXE_FILE=$(find release/ -name "Shop-POS-System-Setup-*.exe" -type f | head -1)
            if [ -n "$EXE_FILE" ]; then
              echo "Uploading $EXE_FILE manually..."
              gh release upload "$TAG" "$EXE_FILE" --clobber
              echo "✓ Manual upload attempted"
            fi
          else
            echo "✓ EXE is already in release: $EXE_ASSET"
          fi

      - name: Clean up old releases (keep only latest 10)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Cleaning up old releases (keeping latest 10) ==="
          # Get ALL releases sorted by creation date (newest first)
          ALL_RELEASES=$(gh api repos/${{ github.repository }}/releases --paginate --jq '.[] | "\(.id) \(.tag_name) \(.created_at)"' 2>/dev/null || echo "")
          if [ -z "$ALL_RELEASES" ]; then
            echo "No releases to clean up"
            exit 0
          fi

          # Count releases
          TOTAL=$(echo "$ALL_RELEASES" | wc -l)
          echo "Total releases: $TOTAL"

          if [ "$TOTAL" -le 10 ]; then
            echo "Only $TOTAL releases — keeping all (limit is 10)"
            exit 0
          fi

          # Get releases to delete (everything after the first 10)
          DELETE_COUNT=$((TOTAL - 10))
          echo "Deleting $DELETE_COUNT old releases..."

          echo "$ALL_RELEASES" | tail -n $DELETE_COUNT | while read id tag date; do
            echo "Deleting release $tag (id=$id, created=$date)..."
            gh api -X DELETE "repos/${{ github.repository }}/releases/$id" 2>/dev/null && echo "✓ Deleted $tag" || echo "⚠ Failed to delete $tag"
          done

          echo "=== Cleanup complete ==="
          echo "Remaining releases:"
          gh api repos/${{ github.repository }}/releases --jq '.[].tag_name' 2>/dev/null | head -10
