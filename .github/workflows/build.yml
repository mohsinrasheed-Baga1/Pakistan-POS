name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build and release (e.g. v2.7.30)'
        required: true
        default: 'v2.7.30'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            echo "TAG=$TAG" >> $GITHUB_OUTPUT
            echo "Building for manually specified tag: $TAG"
            git checkout "$TAG"
          else
            TAG="${{ github.ref_name }}"
            echo "TAG=$TAG" >> $GITHUB_OUTPUT
            echo "Building for pushed tag: $TAG"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bun
        run: |
          npm install -g bun
          bun --version

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma Client
        run: bun run db:generate

      - name: Build Next.js
        run: bun run build
        env:
          DATABASE_URL: "file:./pos.db"

      - name: Prepare Electron
        run: node scripts/prepare-electron.mjs
        env:
          DATABASE_URL: "file:./pos.db"

      - name: Build Windows Installer and Publish to GitHub (delta updates)
        run: bunx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify installer was built
        shell: bash
        run: |
          echo "=== Files in release/ ==="
          ls -la release/ || true
          echo ""
          echo "=== Looking for .exe ==="
          find release/ -name "*.exe" -type f 2>/dev/null || true
          echo ""
          # Verify the .exe exists and has reasonable size (>10MB)
          EXE_FILE=$(find release/ -name "Shop-POS-System-Setup-*.exe" -type f | head -1)
          if [ -z "$EXE_FILE" ]; then
            echo "ERROR: No .exe file found in release/"
            exit 1
          fi
          EXE_SIZE=$(stat -c%s "$EXE_FILE" 2>/dev/null || wc -c < "$EXE_FILE")
          echo "Found: $EXE_FILE ($EXE_SIZE bytes)"
          if [ "$EXE_SIZE" -lt 10000000 ]; then
            echo "ERROR: .exe file is too small ($EXE_SIZE bytes < 10MB) — build likely incomplete"
            exit 1
          fi
          echo "✓ Installer verified"
          echo ""
          echo "=== Verifying latest.yml (for delta updates) ==="
          if [ -f "release/latest.yml" ]; then
            echo "latest.yml contents:"
            cat release/latest.yml
            echo ""
            echo "✓ latest.yml exists — electron-updater will use this for delta updates"
          else
            echo "WARNING: latest.yml not found — delta updates may not work"
          fi
          echo ""
          echo "=== Verifying .blockmap (for delta updates) ==="
          BLOCKMAP=$(find release/ -name "*.exe.blockmap" -type f | head -1)
          if [ -n "$BLOCKMAP" ]; then
            echo "Found blockmap: $BLOCKMAP"
            echo "✓ Blockmap exists — only changed blocks will be downloaded"
          else
            echo "WARNING: No .blockmap found — full download will be used"
          fi
